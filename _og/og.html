<!doctype html>
<!-- Source for ../og.png (the 1200x630 link-preview card). Regenerate with:
     CHROME="/c/Program Files/Google/Chrome/Application/chrome.exe"
     "$CHROME" --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 \
       --screenshot="$(cygpath -w site/og.png)" "file:///$(cygpath -w site/_og/og.html)"
-->
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .canvas{width:1200px;height:630px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#0A2540 0%,#0C5E9E 58%,#0B84D8 100%)}
  .flake{position:absolute;stroke:#FFFFFF;opacity:.10}
  .left{position:absolute;left:70px;top:158px;width:472px;color:#fff}
  .kicker{font-size:20px;font-weight:900;letter-spacing:5px;color:#7FD8FF}
  h1{font-size:50px;font-weight:900;letter-spacing:-1.2px;line-height:1.08;margin-top:18px}
  p{font-size:23px;font-weight:600;opacity:.9;margin-top:20px;line-height:1.35}
  .phones{position:absolute;right:-34px;top:0;height:630px;display:flex;align-items:center;gap:20px}
  .phones img{width:198px;border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.42)}
  .phones img:nth-child(1){transform:rotate(-7deg) translateY(18px)}
  .phones img:nth-child(2){transform:translateY(-14px)}
  .phones img:nth-child(3){transform:rotate(7deg) translateY(22px)}
</style></head>
<body><div class="canvas">
  <svg class="flake" width="420" height="420" style="left:-120px;top:300px" viewBox="0 0 64 64"
       stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M32 8V56M11 20L53 44M11 44L53 20"/>
  </svg>
  <div class="left">
    <div class="kicker">POLAR GAMES INC</div>
    <h1>Party games for the people in the room with you.</h1>
    <p>No accounts. No ads. No tracking.</p>
  </div>
  <div class="phones">
    <img src="../cantsay/img/01.png">
    <img src="../cantsay/img/02.png">
    <img src="../cantsay/img/04.png">
  </div>
</div></body></html>

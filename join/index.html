<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the game</title>
<meta name="description" content="Someone invited you to a Polar Games room. Get the app and join with the room code.">
<link rel="canonical" href="https://polargamesinc.com/join/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Polar Games Inc">
<meta property="og:title" content="You're invited to a game">
<meta property="og:description" content="Tap to join the room. Everyone plays on their own phone. No accounts, no ads.">
<meta property="og:url" content="https://polargamesinc.com/join/">
<meta property="og:image" content="https://polargamesinc.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root{
    --bg:#FFFDF5; --card:#FFFFFF; --border:#E8DECF; --ink:#1A1A22; --dim:#6E6A78;
    --faint:#A9A4B0; --accent:#8B3DFF; --magenta:#FF2DAA; --green:#0FB85A;
    --deep:#0A2540;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);
    color:var(--ink);line-height:1.55;min-height:100vh}
  img{max-width:100%;height:auto;display:block}
  a{color:var(--accent);font-weight:700}

  .hero{background:linear-gradient(150deg,var(--magenta),var(--accent));color:#fff;
    padding:56px 24px 76px;text-align:center}
  .kicker{font-size:13px;font-weight:900;letter-spacing:3px;opacity:.92;text-transform:uppercase}
  .hero h1{font-size:clamp(32px,7.5vw,50px);font-weight:900;letter-spacing:-1px;margin-top:10px}

  .wrap{max-width:520px;margin:-44px auto 0;padding:0 20px 56px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px;
    box-shadow:0 18px 40px rgba(0,0,0,.06);text-align:center}

  .codelabel{font-size:12px;font-weight:900;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
  .code{font-size:clamp(44px,13vw,64px);font-weight:900;letter-spacing:12px;color:var(--magenta);
    margin:2px 0 0 6px;font-variant-numeric:tabular-nums}
  .nocode{font-size:20px;font-weight:800;color:var(--dim);margin-top:8px}

  .btn{display:block;background:var(--green);color:#fff;font-weight:800;text-decoration:none;
    padding:17px 28px;border-radius:999px;margin-top:22px;font-size:17px;border:0;width:100%;
    cursor:pointer;font-family:inherit}
  .btn.alt{background:var(--accent)}
  .steps{color:var(--dim);font-size:15px;margin-top:22px;text-align:left;list-style:none;
    display:grid;gap:10px;counter-reset:s}
  .steps li{counter-increment:s;padding-left:38px;position:relative}
  .steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;
    border-radius:999px;background:var(--accent);color:#fff;font-weight:900;font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .note{color:var(--faint);font-size:13px;font-weight:700;margin-top:18px}
  .foot{text-align:center;color:var(--faint);font-size:13px;font-weight:700;margin-top:26px}
  .foot a{color:var(--faint)}
</style>
</head>
<body>

<div class="hero">
  <div class="kicker">You're invited</div>
  <h1 id="headline">Join the game</h1>
</div>

<div class="wrap">
  <div class="card">
    <div class="codelabel">Room code</div>
    <div class="code" id="code">----</div>

    <a class="btn" id="cta" href="https://polargamesinc.com/">Get the app</a>

    <ol class="steps">
      <li>Install the app.</li>
      <li>Open it and tap <strong>PLAY</strong>, then <strong>Join</strong>.</li>
      <li>Type your name and the room code above.</li>
    </ol>

    <p class="note" id="note"></p>
  </div>

  <p class="foot"><a href="https://polargamesinc.com/">Polar Games Inc</a></p>
</div>

<script>
/* Invite landing (PRD §35.1).
 *
 * This page only ever runs when the app is NOT installed: when it is, the OS
 * intercepts the link first (Android App Links / iOS Universal Links) and this
 * HTML is never fetched. So its whole job is to show the code and forward the
 * visitor to the right store for their platform.
 *
 * Note this is the one page on the site that uses JavaScript (site/README.md
 * otherwise says no JS): reading a query string and branching on platform
 * cannot be done statically, and GitHub Pages has no server to do it for us.
 */
(function () {
  var GAMES = {
    'cant-say-online': {
      name: "Can't Say That!",
      android: 'https://play.google.com/store/apps/details?id=com.polargamesinc.cantsay',
      /* The iOS release is still in review (PRD §34.6). Until it lands, iOS
       * visitors get the code plus an honest "coming soon", never a dead link. */
      ios: null
    }
  };
  /* Anything not sliced into its own app lives in the hub, which is private
   * staging with no public listing (§34.1) — hence the tester opt-in URL. */
  var HUB = {
    name: 'Party Games',
    android: 'https://play.google.com/apps/testing/com.polargamesinc.funpartygames',
    ios: null
  };

  var q = new URLSearchParams(location.search);
  /* Room codes are exactly 4 letters. Anything else is treated as absent rather
   * than trimmed into a plausible-looking partial: showing "XYZ" as if it were
   * the code would just send the guest to a room that cannot exist. */
  var raw = (q.get('c') || '').toUpperCase().replace(/[^A-Z]/g, '');
  var code = raw.length === 4 ? raw : '';
  var game = GAMES[q.get('g') || ''] || HUB;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
    (/Mac/i.test(ua) && typeof document.ontouchend !== 'undefined');

  var elCode = document.getElementById('code');
  var elCta = document.getElementById('cta');
  var elNote = document.getElementById('note');
  document.getElementById('headline').textContent = 'Join ' + game.name;
  document.title = 'Join ' + game.name;

  if (code) {
    elCode.textContent = code;
  } else {
    elCode.className = 'nocode';
    elCode.textContent = 'Ask your host for the code';
  }

  if (isAndroid && game.android) {
    /* Play preserves `referrer` through the install; the app reads it once on
     * first launch and pre-fills the code (PRD §35.5). */
    var url = game.android;
    if (code && url.indexOf('/store/apps/details') !== -1) {
      url += '&referrer=' + encodeURIComponent('c=' + code);
    }
    elCta.href = url;
    elCta.textContent = 'Get it on Google Play';
  } else if (isIOS && game.ios) {
    elCta.href = game.ios;
    elCta.textContent = 'Download on the App Store';
    elCta.className = 'btn alt';
    /* iOS has no install-referrer equivalent, so hand the code over via the
     * clipboard instead and let the app offer it on first launch (§35.5). */
    if (code) {
      elCta.addEventListener('click', function () {
        try { navigator.clipboard && navigator.clipboard.writeText(code); } catch (e) {}
      });
    }
  } else if (isIOS) {
    elCta.href = 'https://polargamesinc.com/cantsay/';
    elCta.textContent = 'Coming soon to the App Store';
    elCta.className = 'btn alt';
    elNote.textContent = 'Not on the App Store yet. Write the code down and we will let you know.';
  } else {
    /* Desktop. Nothing to install here, so point them at a phone. */
    elCta.href = 'https://polargamesinc.com/';
    elCta.textContent = 'About Polar Games';
    elCta.className = 'btn alt';
    elNote.textContent = 'Open this link on your phone to install the app and join.';
  }

  if (code && !elNote.textContent) {
    elNote.textContent = 'Room codes expire when the host closes the room.';
  }
})();
</script>

</body>
</html>
